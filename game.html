const LOG=[['v31 (latest)','Improved co-op defeat/wait/spectate flow, added retry feedback for dropped connections, reduced snapshot backlog, clarified username editing and the waiting room, showed host name/health to guests, and added a team-wipe safety revive.'],['v30','Added co-op downed screen with wait-for-revival or leave-to-title options, selectable multiplayer usernames, redesigned Mason Borg, Triple T and Cartman, and enhanced Naoya ability effects. Includes improved attack warnings and the gentler Chef Chaos Last Stand from v29.'],['v28','Added host-authoritative online co-op lobby with invite links, per-player character selection, remote controls, shared boss-rush snapshots, revived/downed teammate state, and 1.75x boss health for every multiplayer boss.'],['v27','ALL JUST A GAME typography refined into centered, tracked steel lettering with a subtle cinematic vignette and deliberate word entrances. GAME flickers in and out three times, then fades over exactly 2 seconds. Fixed second-boss immortality after Last Stand: boss regeneration no longer runs after HP reaches zero, and the Last Stand exit clears invulnerability.'],['v26','ALL JUST A GAME lyric sequence moved one second earlier and rebuilt to show ALL, JUST, A, and GAME one word at a time. GAME now flashes twice, then fades slowly in a restrained cinematic style.'],['v25','ALL JUST A GAME assembles as one centered phrase. Fixed boss invulnerability timer initialization and safeguards. Redesigned the Food Court with clearer upgrade plates and a new buffet background.'],['v24','ALL JUST A GAME remade: it slams in on the three crash hits of the song, pulses on the kicks and shatters on the beat. The greyscale breakdown and THE DROP land on the bass drop and kick return. Every boss has its own Last Stand look.'],['v23','Last Stand: about half the particles and gentler attack pacing, two new themed attacks for every boss (28 total), the screen drains to greyscale at 33s, colour creeps back from 40s to 43s, and ALL JUST A GAME flashes at 46-48s. Bullets get dark outlines so they read on bright backgrounds.'],['v22','Remade Food Court (rerolls, categories, build bar), Achievements screen on the title, Last Stand tuned and now driven by the real music (beats, bass, treble and song sections), remade Cartman and Triple T, ability descriptions and nerfs, weaker and slower base shots, less base health.'],['v21','Higher quality audio (160 kbps, EQ and compressor), music-reactive Last Stand visualizer, skills cancel in Last Stand, per-boss Last Stand attacks, boss gimmicks, much tougher late bosses, remade Broccoli, Evil Zach and Soda, new abilities for every fighter.'],['v20','Every Last Stand now plays the special attack song and lasts the whole song, with INTRO, BUILD-UP, DROP and FINALE sections. Boss-specific Last Stand attacks and arenas. Food-themed late bosses, new late-boss attacks, harder bosses, minion designs per fighter, new Food Court, remade Naoya and Cartman, more Super FX options.'],['v19','Last Stand remade (25s, vortex arena, heartbeat, shrinking rings, second wind), HP reverted, Mason Borg, Triple T and Naoya remade, Cartman added.'],['v18','30-second Last Stand survival, HP rework (half hearts, regen), tougher bosses, 3 abilities per fighter, new Food Court, remade bosses, lore shards.'],['v17','15 new music tracks (final-phase and endless music), more Super Graphics settings on a second page, better character select, richer title screen.'],['v16','Playable characters (Zach, Mason Borg, Triple T, Naoya) with their own playstyles, plus 9 new upgrades and abilities.'],['v15','Heal after every boss, Super FX quality presets, color grading, flare intensity, boss entrance bursts, dash speed streaks.'],['v14','Your new boss music order, new track, Super Graphics supernovas, ambient particles and more settings, remade Colonel Chicken.'],['v13','Sound effects and background music (13 tracks), with Music and SFX volume in Settings.'],['v12','Super Graphics Mode: motion trails, shockwave distortion, zoom blur, dynamic lighting, god rays, grain, edge glow, boss aura sparks and a full Super FX settings screen.'],['v11','Super Graphics Mode rebuilt on a new FX engine: animated lens flares, bloom, chromatic aberration, impact frames.'],['v10','Super Graphics Mode: realistic lighting, anamorphic lens flares, bloom, color grading, lens dirt, god rays and fog.'],['v9','Super Graphics Mode toggle with photosensitivity warning.'],['v8','Unique projectile shapes and trails per boss, new ability visuals, Black Hole, Dragon and Reality Fracture abilities, evolutions, Last Stand, phase transitions, animated arenas, Crimson Emperor and False Hero.'],['v7','Bosses scale in health and attack speed. 7 attacks each, phase shields, phase dialogue, turrets and bombs, 7 new upgrades, branching endings, this update log.'],['v6','Settings menu, manual aim, auto shoot and auto aim, pause menu, new HUD.'],['v5','Rebuilt visuals, particle engine, 5 attacks per boss.'],['v4','New title screen, hazards, impact flashes.'],['v3','Hand-drawn sprites and lore dialogue.'],['v2','Upgrades and the Food Court.'],['v1','First playable boss rush.']];
